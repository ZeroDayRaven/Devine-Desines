name: devine-designs

services:
- name: web
  github:
    branch: main
    repo: YOUR_GITHUB_USERNAME/your-repo-name
  http_port: 5000
  envs:
  - key: FLASK_ENV
    value: production
  - key: DEBUG
    value: "false"
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SECRET_KEY}
  - key: ADMIN_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${ADMIN_API_KEY}
  - key: SENDGRID_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SENDGRID_API_KEY}
  - key: SENDGRID_FROM_EMAIL
    value: ${SENDGRID_FROM_EMAIL}
  - key: CORS_ORIGINS
    value: ${CORS_ORIGINS}
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${DATABASE_URL}
  health_check:
    http_path: /health
    period_seconds: 30
    timeout_seconds: 10
    initial_delay_seconds: 5
    failure_threshold: 3

databases:
- name: postgres
  engine: PG
  version: "15"
  production: true
