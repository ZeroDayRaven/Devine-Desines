name: devine-designs
services:
- name: web
  github:
    branch: main
    repo: YOUR_GITHUB_USERNAME/divine-designs
  dockerfile_path: backend/Dockerfile
  source_dir: backend
  http_port: 5000
  envs:
  - key: FLASK_ENV
    value: production
  - key: DEBUG
    value: "false"
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SECRET_KEY}
  - key: ADMIN_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${ADMIN_API_KEY}
  - key: SENDGRID_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SENDGRID_API_KEY}
  - key: SENDGRID_FROM_EMAIL
    value: ${SENDGRID_FROM_EMAIL}
  - key: CORS_ORIGINS
    value: ${CORS_ORIGINS}
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${DATABASE_URL}
  health_check:
    http_path: /health
    period_seconds: 30
    timeout_seconds: 10
    initial_delay_seconds: 5
    failure_threshold: 3
  run_command: gunicorn --workers 2 --worker-class sync --bind 0.0.0.0:5000 --timeout 120 --access-logfile - --error-logfile - run:app
  http:
    cors:
      allow_origins:
      - exact: https://devinedesignssa.com
      - exact: https://www.devinedesignssa.com
      allow_methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
databases:
- name: postgres
  engine: PG
  version: "15"
  production: true
