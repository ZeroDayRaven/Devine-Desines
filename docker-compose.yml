version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: devine
      POSTGRES_PASSWORD: devine123
      POSTGRES_DB: devine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devine"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Database (override if needed)
      DATABASE_URL: postgresql://devine:[REDACTED]@db:5432/devine
      FLASK_ENV: production
      DEBUG: false
    volumes:
      - ./backend:/app
    command: python run.py

volumes:
  postgres_data:
